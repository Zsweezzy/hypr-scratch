[package]
name = "hypr-scratch"
version = "1.1.1"
edition = "2024"
description = "A floating iced scratchpad notepad for Hyprland"
license = "MIT"

[[bin]]
name = "hypr-scratch"
path = "src/main.rs"

# Test-only window for the acceptance suite; deliberately not installed.
[[bin]]
# Deliberately short: Linux truncates /proc/PID/comm to 15 chars and `pkill -x` would stop matching.
name = "hypr-sink"
path = "src/bin/sink.rs"

[dependencies]
gtk4 = "0.11.5"
libc = "0.2"
# hyprctl offers the notepad's rectangle only as JSON; one crate beats a jq/socat dependency on PATH.
serde_json = "1.0"
